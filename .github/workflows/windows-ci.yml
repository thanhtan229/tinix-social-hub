name: Windows CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test on Windows / Python 3.11
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      TINIX_OPEN_BROWSER: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile source and tests
        run: python -m compileall -q app tests

      - name: Verify Google Chrome for browser smoke tests
        shell: pwsh
        run: |
          $paths = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe",
            "$env:LOCALAPPDATA\Google\Chrome\Application\chrome.exe"
          )
          if (-not ($paths | Where-Object { Test-Path $_ })) {
            throw "Google Chrome is required for tests/test_frontend_playwright.py."
          }

      - name: Run test suite
        run: python -m unittest discover -s tests -p "test_*.py" -v
